spring:
  application:
    name: students-manager
  datasource:
    url: jdbc:h2:mem:studentsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false
      path: /h2-console
